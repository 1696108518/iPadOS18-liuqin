name: kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UNIXNU_SHARED_XNU_BUILD: "0"
  OS_PROFILE: ipados-18.7.10-22H374
  UNIXNU_REF: c96b29975645b711dc06bc435c3ad27321ce817c

jobs:
  kernel:
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          token: ${{ github.token }}

      - name: flatten device tree to device root
        run: |
          set -euo pipefail
          cp -Rf device/UniXNU-liuqin/. device/
          rm -rf device/UniXNU-liuqin
          ls device | head -40

      - uses: actions/checkout@v4
        with:
          repository: 1696108518/UniXNU
          ref: liuqin
          path: UniXNU

      - name: tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          brew install dtc lzfse || true
          python3 -V
          python3 -c 'import tomllib; print("tomllib ok")'
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h /
          echo "PONG_MIG=$(xcrun -f mig)" >> "$GITHUB_ENV"
          echo "PONG_MIGCOM=$(xcrun -f migcom || true)" >> "$GITHUB_ENV"
          echo "mig=$(xcrun -f mig)"

      - name: install OS profile and component recipe
        run: |
          set -euo pipefail
          python3 device/scripts/install-unixnu-inputs.py --unixnu UniXNU 2>&1 | tee install.log
          python3 device/scripts/patch-unixnu-kernel-step.py --unixnu UniXNU 2>&1 | tee -a install.log

      - name: local build inputs
        run: |
          set -euo pipefail
          WS="${{ github.workspace }}"
          printf '%s\n' \
            '[pong_build]' \
            "tree = \"${WS}/tree\"" \
            'developer_dir = "/Applications/Xcode.app/Contents/Developer"' \
            "volume_layout = \"${WS}/device/volume-layout.json\"" \
            "sheng_source = \"${WS}/device/UniXNU-sheng/package\"" \
            > device/local.toml
          cat device/local.toml
          echo "PONG_VOLUME_LAYOUT=${WS}/device/volume-layout.json" >> "$GITHUB_ENV"
          echo "UNIXNU_DEVICE=${WS}/device" >> "$GITHUB_ENV"

      - name: select defconfig
        working-directory: UniXNU
        run: |
          set -euo pipefail
          python3 ./unixnu defconfig liuqin_ipados18_defconfig -D ../device

      - name: fetch IPSW kernelcache
        working-directory: UniXNU
        run: |
          set -euo pipefail
          python3 ./unixnu ipsw fetch KernelCache -D ../device

      - name: build kernel
        working-directory: UniXNU
        env:
          CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PONG_ADRENO_FIRMWARE: ${{ github.workspace }}/device/firmware/adreno730
        run: |
          set -euo pipefail
          chip="$(printf '%s' "${CHIP_ID}" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if ! python3 ./unixnu build kernel -D ../device --local ../device -j 2 \
                 --os ipados-18.7.10-22H374 --skip-prelink --unique-chip-id "${chip}" 2>&1 | tee ../kernel-build.log; then
            echo "=== BUILD FAILED; environment ===" >> ../kernel-build.log
            { df -h /; vm_stat | head -6; sysctl -n hw.memsize hw.ncpu; } >> ../kernel-build.log 2>&1
            echo "=== BUILD FAILED; dumping component logs ===" >> ../kernel-build.log
            for f in $(find ../UniXNU/out -name '*.log' 2>/dev/null | head -20) ../build-*.log; do
              [ -f "$f" ] || continue
              echo "=== $f ===" >> ../kernel-build.log
              tail -150 "$f" >> ../kernel-build.log 2>&1
              echo "=== $f : lines without INSTALLHDR (tail 120) ===" >> ../kernel-build.log
              grep -v 'INSTALLHDR' "$f" 2>/dev/null | tail -120 >> ../kernel-build.log 2>&1 || true
            done
            exit 1
          fi

      - name: collect
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          find . -name kernel.macho -exec cp {} out/ \;
          find . -name '*.adt' -exec cp {} out/ \;
          find . -name 'PONG_BUILD_RESULT.json' -exec cp {} out/ \;
          find . -name 'pong-boot-manifest.json' -exec cp {} out/ \;
          cp kernel-build.log out/ 2>/dev/null || true
          cp install.log out/ 2>/dev/null || true
          ls -lR out | head -40

      - name: publish logs to ci-diag
        if: always()
        run: |
          set -euo pipefail
          cd device
          cp ../kernel-build.log . 2>/dev/null || true
          cp ../install.log . 2>/dev/null || true
          git config user.email 'ci@example.com'
          git config user.name 'ci'
          git add kernel-build.log install.log
          git commit -m 'ci build log' || true
          git push origin HEAD:ci-diag --force || true
          echo done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-out
          path: out
          retention-days: 3
